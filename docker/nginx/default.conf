map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 8m;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
    }

    # Recorded segments and export files: Laravel checks access and answers with X-Accel-Redirect.
    location /_protected/rec/ {
        internal;
        alias /data/rec/;
        add_header Cache-Control "private, max-age=3600";
        types { video/mp2t ts; }
    }
    location /_protected/exports/ {
        internal;
        alias /data/exports/;
    }

    # Live view relay (go2rtc). Every request is authorised by Laravel first.
    location = /_live_auth {
        internal;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI /internal/live-auth;
        fastcgi_param QUERY_STRING "";
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
    }
    location /live/ {
        auth_request /_live_auth;
        resolver 127.0.0.11 valid=30s;
        set $go2rtc http://go2rtc:1984;
        rewrite ^/live/(.*)$ /$1 break;
        proxy_pass $go2rtc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
